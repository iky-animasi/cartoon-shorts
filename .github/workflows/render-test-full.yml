# Tes ukur profil PENUH episode 4 v2: render 10 frame (1200-1209, adegan kafe)
# untuk mengukur detik/frame di runner GitHub sebelum render penuh 1869 frame.
# Komposisi DuniaTanpaBohong default profil penuh (DOF nyala, shadow 4096, MSAA 4, grain nyala).
name: Render Test Full Profile Ep4 (10 frame)

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libnss3 libnspr4 libx11-6 libxext6
      - name: Install project dependencies
        run: |
          npm ci --no-audit --no-fund
          node scripts/patch-remotion-ports.mjs
          npx remotion browser ensure
      - name: Render 10 frame profil penuh
        run: |
          mkdir -p out .remotion-tmp
          echo "MULAI_RENDER $(date +%s)"
          REMOTION_TMP=$PWD/.remotion-tmp npx remotion render DuniaTanpaBohong out/test-full.mp4 --frames=1200-1209
          echo "SELESAI_RENDER $(date +%s)"
      - uses: actions/upload-artifact@v4
        with:
          name: test-full-videoonly
          path: out/test-full.mp4
